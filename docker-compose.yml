services:
  postgres:
    image: postgres:16-alpine
    container_name: redmaestra_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: redmaestra_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    container_name: redmaestra_api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@redmaestra_db:5432/redmaestra_dev
      - JWT_SECRET=super-secret
    depends_on:
      - postgres

volumes:
  postgres-data: